server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: workbench-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workbench}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

workbench:
  data-dir: ${WORKBENCH_DATA_DIR:./data}
  python-rag-base-url: ${PYTHON_RAG_BASE_URL:http://localhost:8000}
  github:
    token: ${GITHUB_TOKEN:}
  llm:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [request_id=%X{requestId:-none}] %logger{36} - %msg%n"
